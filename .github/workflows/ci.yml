name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: .venv/bin/python
          - os: windows-latest
            python: .venv/Scripts/python.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install development dependencies
        run: |
          python -m venv .venv
          "${{ matrix.python }}" -m pip install -r requirements.txt
      - name: Run code quality checks
        run: ./scripts/build.sh check
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: '"${{ matrix.python }}" -m pytest'
      - name: Test independent MCP servers
        run: |
          "${{ matrix.python }}" -m pip install mcp==1.12.4
          MCP_TEST_PYTHON="${{ github.workspace }}/${{ matrix.python }}" "${{ matrix.python }}" -m pytest tests/test_mcp.py
      - name: Build add-on
        run: ./scripts/build.sh build
      - uses: actions/upload-artifact@v4
        with:
          name: anki-smart-notes-${{ matrix.os }}
          path: dist/smart-notes.ankiaddon
